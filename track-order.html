<section class="track-page">

    <div class="track-header">

        <div class="section-label">ORDER TRACKING</div>

        <h1>
            WHERE'S<br>
            <span>MY ORDER?</span>
        </h1>

        <p>
            Enter your Order ID and phone number to check
            your latest order status.
        </p>

    </div>


    <div class="track-box">

        <form id="trackForm">

            <div class="form-group">

                <label for="trackOrderId">
                    ORDER ID
                </label>

                <input
                    type="text"
                    id="trackOrderId"
                    placeholder="e.g. CB-0001"
                    required>

            </div>


            <div class="form-group">

                <label for="trackPhone">
                    PHONE NUMBER
                </label>

                <input
                    type="tel"
                    id="trackPhone"
                    placeholder="01XXXXXXXXX"
                    required>

            </div>


            <button
                type="submit"
                class="track-submit">

                TRACK ORDER →

            </button>

        </form>


        <div
            id="trackResult"
            class="track-result">

        </div>

    </div>

</section>
